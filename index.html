<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Настройка CVBS камеры</title>
<style>
body{margin:0;background:#10151d;color:#edf2f8;font:16px system-ui}main{max-width:1100px;margin:auto;padding:24px}h1{font-size:26px}p{color:#aab9ca;line-height:1.5}.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:24px}section{background:#1b2431;padding:20px;border-radius:14px}img{width:100%;background:#080c12;aspect-ratio:3/2;object-fit:contain}label{display:grid;grid-template-columns:1fr 70px;gap:6px;margin:14px 0}input{grid-column:1/-1;width:100%;accent-color:#48bfa4}output{text-align:right;color:#6ee2c7}button{background:#48bfa4;border:0;padding:12px 16px;border-radius:8px;font:inherit;cursor:pointer;margin:5px}button:disabled{opacity:.5;cursor:wait}.secondary{background:#354456;color:white}#message{min-height:2em;color:#83dcc4}@media(max-width:760px){.grid{grid-template-columns:1fr}}
</style><main><h1>CVBS камера · коррекция изображения</h1>
<p>Протестированная карта захвата: MacroSilicon MS2106E. Настройки применяются ко всему RTSP-потоку и сохраняются после перезагрузки. При применении видео кратковременно прерывается.</p>
<div class="grid"><section><img id="preview" alt="Нажмите «Обновить кадр»"><button id="refresh" class="secondary">Обновить кадр</button><p id="stream"></p><p>Это контрольный кадр. Для непрерывного видео откройте RTSP в пульте или VLC.</p></section>
<section><form id="form"><div id="controls"></div><button id="apply" type="submit">Применить и сохранить</button><button id="balanced" type="button" class="secondary">Исходный профиль</button></form><p id="message" role="status"></p></section></div></main>
<script>
const specs={brightness:['Яркость захвата',0,255,1,60],contrast:['Контраст захвата',0,255,1,200],saturation:['Цветность захвата',0,255,1,160],lift:['Яркость изображения',-.3,.3,.01,0],gain:['Контраст изображения',.5,2.5,.01,1.05],color:['Насыщенность',0,3,.01,1.1],gamma:['Подъём теней (гамма)',.5,3,.01,1.3],gamma_weight:['Вес коррекции гаммы',0,1,.01,.6],denoise:['Шумоподавление',0,6,.1,1.2],sharpness:['Резкость',0,1.5,.05,.4]};
const message=document.querySelector('#message'), controls=document.querySelector('#controls');
for(const [key,s] of Object.entries(specs)){const label=document.createElement('label');label.textContent=s[0];const out=document.createElement('output'),input=document.createElement('input');input.type='range';input.id=key;input.min=s[1];input.max=s[2];input.step=s[3];input.value=s[4];out.textContent=input.value;input.oninput=()=>out.textContent=input.value;label.append(out,input);controls.append(label);}
function fill(s){for(const [key,v] of Object.entries(s)){const input=document.getElementById(key);input.value=v;input.oninput();}}
async function api(url,options){const response=await fetch(url,options);if(!response.ok){let reason='Ошибка '+response.status;try{reason=(await response.json()).error||reason;}catch{}throw Error(reason);}return response;}
async function snapshot(){const button=document.querySelector('#refresh');button.disabled=true;try{const response=await api('/snapshot.jpg?t='+Date.now());const image=document.querySelector('#preview');if(image.dataset.url)URL.revokeObjectURL(image.dataset.url);image.dataset.url=URL.createObjectURL(await response.blob());image.src=image.dataset.url;}catch(e){message.textContent=e.message;}finally{button.disabled=false;}}
document.querySelector('#refresh').onclick=snapshot;
document.querySelector('#balanced').onclick=()=>{fill(Object.fromEntries(Object.entries(specs).map(([k,s])=>[k,s[4]])));message.textContent='Профиль выбран. Нажмите «Применить и сохранить».';};
document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const button=document.querySelector('#apply');button.disabled=true;message.textContent='Применение…';try{const settings=Object.fromEntries(Object.keys(specs).map(k=>[k,Number(document.getElementById(k).value)]));await api('/api/settings',{method:'POST',headers:{'Content-Type':'application/json','X-CVBS-Control':'1'},body:JSON.stringify(settings)});message.textContent='Настройки сохранены.';await snapshot();}catch(e){message.textContent=e.message;}finally{button.disabled=false;}};
document.querySelector('#stream').textContent='RTSP: rtsp://'+location.hostname+':554/live';
api('/api/settings').then(r=>r.json()).then(s=>{fill(s);snapshot();}).catch(e=>message.textContent=e.message);
</script></html>
