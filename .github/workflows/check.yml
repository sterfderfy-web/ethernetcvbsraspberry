name: Check package
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: curl -fL --retry 2 https://github.com/bluenviron/mediamtx/releases/download/v1.21.1/mediamtx_v1.21.1_linux_arm64.tar.gz -o binaries/mediamtx-v1.21.1-arm64.tar.gz
      - run: sha256sum -c SHA256SUMS
      - run: bash -n install.sh capture.sh check.sh cvbs-patch-run cvbs-patch-stop
      - run: python3 -m unittest discover -s . -p 'test_*.py'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - run: go test -tags puregohid ./...
        working-directory: ms-tools-src
      - run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -tags puregohid -o /tmp/ms-tools-arm64 ./cli
        working-directory: ms-tools-src
