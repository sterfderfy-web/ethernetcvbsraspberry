logLevel: info
rtsp: yes
rtspAddress: :554
rtspTransports: [udp, tcp]
rtmp: no
hls: no
webrtc: no
srt: no
moq: no
authMethod: internal
authInternalUsers:
  - user: any
    ips: ['127.0.0.1', '::1']
    permissions:
      - action: publish
        path: live
  - user: any
    permissions:
      - action: read
        path: live
paths:
  live:
    source: publisher
